version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: diabetes_care_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: diabetes_care
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diabetes_care"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diabetes_care_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ENV: "production"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_NAME: "diabetes_care"
      JWT_SECRET: "super-secret-jwt-key-change-in-production"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
